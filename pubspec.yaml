name: mosona_manager
description: "Mosona Manager mobile app - server monitoring & terminal management."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  forui: ^0.25.0

  # networking
  dio: ^5.11.1
  web_socket_channel: ^3.0.3

  # persistence & config
  shared_preferences: ^2.5.3

  # navigation
  go_router: ^18.0.1

  # charts & terminal
  fl_chart: ^1.2.0
  xterm: ^4.0.0

  # media & files
  flutter_svg: ^2.2.0
  qr_flutter: ^4.1.0
  image_picker: ^1.2.1
  image: ^4.5.4
  file_picker: ^12.2.0
  share_plus: ^13.3.0

  # misc
  crypto: ^3.0.6
  intl: ^0.20.3
  url_launcher: ^6.3.2
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
